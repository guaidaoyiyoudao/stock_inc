name: Android CI

on:
  push:
    branches: [ "001-stock-dividend-tracker","master" ]
  pull_request:
    branches: [ "001-stock-dividend-tracker" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      env:
        # CI 直连官方仓库，绕开阿里云镜像的间歇性 502 和不全的 artifact
        USE_CHINA_MIRROR: "false"
      run: ./gradlew build
