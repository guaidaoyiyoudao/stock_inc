# Robolectric 全局配置
# - application: 用系统空 Application，绕过项目的 @HiltAndroidApp StockDividendApp
#   （其 onCreate 会调通知调度并依赖 Hilt 注入，单测环境不配 Hilt 会崩）
# - sdk: 锁定 35。项目 compileSdk=36，但 Robolectric 跑 SDK 36 需 JDK 21，
#   而项目是 Java 17 toolchain；SDK 35 对单测行为无实质影响且 JDK 17 可跑通。
application: android.app.Application
sdk: 35
